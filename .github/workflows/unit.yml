name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify runtime lock and public input manifest
        run: |
          set -euo pipefail
          echo 'sha512-UhcFvOaJkk6scvWjWHEi82JonvZXHlW6gAdv1jfBETLs/62ib61Op5xIW/3b/T1aKlsFgFp36JPeceyKbMo7sQ==' | grep -Fx "$(npm view pnpm@11.21.0 dist.integrity)"
          echo '983ae4b733984b71cc6f3f9f4148f1a703e3a3a718b3867c081a73cb98a100dc  runtime/pnpm-lock.yaml' | sha256sum --check --strict
          for identity in '@koromix/koffi-win32-x64@' 'node-pty@' '@vscode/ripgrep-win32-x64@' 'node-addon-require-builtin-win32-x64-msvc@'; do rg -F "$identity" runtime/pnpm-lock.yaml; done
          node -e 'const x=require("./runtime/runtime-inputs.json"); if(x.publicSource.repository!=="https://github.com/deepseek-ai/deepseek-harness"||!x.publicSource.commit.match(/^[0-9a-f]{40}$/)||x.resolver.lockSha256!=="983ae4b733984b71cc6f3f9f4148f1a703e3a3a718b3867c081a73cb98a100dc")process.exit(1)'
          corepack pnpm --dir runtime install --frozen-lockfile --ignore-scripts
          node tools/audit-lifecycle.js runtime
