name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      # Repository policy requires every action to be pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Scan for content that must not be published
        run: npm run scan:leaks

      # Fails on a version or integrity mismatch against upstream.lock.json, so a release
      # cannot be built from a kernel other than the pinned one.
      - name: Install the pinned kernel
        run: npm run kernel:install

      - name: End-to-end
        run: npm run test:e2e

      - name: Build installers
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
