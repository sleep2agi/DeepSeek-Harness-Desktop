name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # Repository policy requires every action to be pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Scan for content that must not be published
        run: npm run scan:leaks

      - name: Scan workflows for unpinned Actions
        run: npm run scan:workflows

      # Fails on a version or integrity mismatch against upstream.lock.json, so a release
      # cannot be built from a kernel other than the pinned one.
      - name: Install the pinned kernel
        run: npm run kernel:install

      - name: End-to-end
        run: npm run test:e2e

      - name: Build installers
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # gh is on the runner. A third-party release action is not on the allow-list
      # and would fail startup even if SHA-pinned.
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mapfile -t files < <(find artifacts -type f ! -name '.*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts to attach" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --generate-notes --title "$tag"
          fi
